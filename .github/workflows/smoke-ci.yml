name: smoke-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo, pdo_sqlite, bcmath, tokenizer, xml, ctype, json, openssl, gd, imagick
          coverage: none

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run startup health
        run: scripts/health/startup.sh

      - name: Run config baseline check
        run: scripts/checks/config-baseline.sh

      - name: Run migrate+seed idempotency check
        run: scripts/checks/migrate-seed-idempotency.sh

      - name: Run smoke CI suite
        run: scripts/ci/smoke.sh
